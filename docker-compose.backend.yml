# Local integration stack. Production deployments use docker-compose.production.yml.
services:
  # Backend API
  backend:
    build: ./backend
    container_name: token-vault-backend
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_TYPE: sqlite

      # SQLite (default)
      SQLITE_FILENAME: /app/data/totp.db

      # JWT (required — no default; set JWT_SECRET in the environment.
      # v1.5.0 removed DATA_ENCRYPTION_KEY: sync is end-to-end encrypted
      # on the client.)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}

      # Registration (dev default: closed unless an invite code is set)
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}

    volumes:
      # Mount data directory for SQLite
      - ./backend/data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Optional - serves the React app)
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: token-vault-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
