# Local integration stack. Production deployments use docker-compose.production.yml.
services:
  # Backend API
  backend:
    build: ./backend
    container_name: token-vault-backend
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_TYPE: sqlite

      # SQLite (default)
      SQLITE_FILENAME: /app/data/totp.db

      # JWT
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: 7d
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-dev-encryption-key-change-in-production}

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}

    volumes:
      # Mount data directory for SQLite
      - ./backend/data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Optional - serves the React app)
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: token-vault-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
